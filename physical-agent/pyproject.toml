[project]
name = "physical-agent"
version = "0.1.0"
description = "Cross-device personal agent: cloud coordinator + device agents (Physical AI Hackathon Malaysia 2026)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "websockets>=14",
  "httpx>=0.27",
  "pydantic>=2.9",
  "agora-agents>=2.14,<3",
  "mcp>=1.29,<2",
]

[project.optional-dependencies]
# Browser-level verification of generated pages (nonce visible, button clickable).
# After install: python -m playwright install chromium
verify = ["playwright>=1.48"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
